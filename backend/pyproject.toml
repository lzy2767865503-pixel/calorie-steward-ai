[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clinical-clarity-backend"
version = "0.1.0"
description = "Privacy-aware deterministic meal calorie estimation API"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.141.1",
  "pydantic==2.11.7",
  "python-multipart==0.0.31",
  "starlette==1.6.0",
  "uvicorn[standard]==0.35.0",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]
