name: Public integrity and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-and-integrity:
    name: Mobile, attribution and secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Scan public files for high-confidence secrets
        run: bash scripts/scan-public-secrets.sh

      - name: Verify official attribution files and app source
        run: bash scripts/check-attribution.sh

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install locked mobile dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Audit for high or critical npm advisories
        working-directory: mobile-app
        run: npm audit --audit-level=high

      - name: Type-check and test mobile product
        working-directory: mobile-app
        run: npm run verify

      - name: Type-check public real-vision harness
        run: ./mobile-app/node_modules/.bin/tsc --project test-harness/tsconfig.json

  catalogue-unit-tests:
    name: Historical catalogue unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: data-pipeline/requirements.txt

      - name: Install pipeline test dependency
        run: python -m pip install -r data-pipeline/requirements.txt

      - name: Run deterministic pipeline unit tests
        working-directory: data-pipeline
        run: python -m unittest -v test_build_food_database.py

  backend-unit-tests:
    name: Historical backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest -q backend/tests
