name: Windows desktop package

on:
  pull_request:
  workflow_dispatch:
    inputs:
      build_store_package:
        description: Build and sideload-test the Partner Center AppX
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  private-two-pass-qa:
    name: Private candidate - Pass A and Pass B on identical bytes
    runs-on: windows-latest
    timeout-minutes: 70
    concurrency:
      group: calorie-private-windows-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            mobile-app/package-lock.json
            windows-app/package-lock.json

      - name: Install locked dependencies
        shell: pwsh
        run: |
          npm --prefix mobile-app ci
          npm --prefix windows-app ci

      - name: Run integrity, privacy, unit, export, and Electron smoke checks
        run: npm --prefix windows-app run verify
        env:
          CALORIE_SMOKE_SCREENSHOT: evidence/windows-setup.png

      - name: Reject malformed WACK and Authenticode policy evidence
        shell: pwsh
        run: ./windows-app/test/windows-release-policy.test.ps1

      - name: Build unsigned QA package
        run: npm --prefix windows-app run build:github

      - name: Require packaged Electron locale resources
        shell: pwsh
        run: |
          $localeDirectory = 'windows-app/release/win-unpacked/locales'
          foreach ($locale in @('en-US.pak', 'zh-CN.pak')) {
            if (-not (Test-Path -LiteralPath (Join-Path $localeDirectory $locale) -PathType Leaf)) {
              throw "Packaged Electron locale missing: $locale"
            }
          }
          $legalDirectory = 'windows-app/release/win-unpacked/resources/legal'
          foreach ($legalFile in @('LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.md')) {
            if (-not (Test-Path -LiteralPath (Join-Path $legalDirectory $legalFile) -PathType Leaf)) {
              throw "Packaged legal file missing: $legalFile"
            }
          }
          $packagedExe = Get-ChildItem windows-app/release/win-unpacked -File -Filter 'Calorie Steward by LAI ZEYU.exe' | Select-Object -First 1
          if (-not $packagedExe) { throw "Packaged Electron executable missing" }
          $fuseText = (& node windows-app/node_modules/@electron/fuses/dist/bin.js read --app $packagedExe.FullName 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { throw "Packaged Electron fuse inspection failed" }
          foreach ($expectedFuse in @(
            'RunAsNode is Disabled',
            'EnableCookieEncryption is Enabled',
            'EnableNodeOptionsEnvironmentVariable is Disabled',
            'EnableNodeCliInspectArguments is Disabled',
            'EnableEmbeddedAsarIntegrityValidation is Enabled',
            'OnlyLoadAppFromAsar is Enabled',
            'LoadBrowserProcessSpecificV8Snapshot is Disabled',
            'GrantFileProtocolExtraPrivileges is Disabled',
            'WasmTrapHandlers is Enabled'
          )) {
            if (-not $fuseText.Contains($expectedFuse)) { throw "Packaged Electron fuse mismatch: $expectedFuse" }
          }

      - name: Generate CycloneDX SBOMs
        shell: pwsh
        run: |
          npm --prefix mobile-app sbom --sbom-format cyclonedx --sbom-type application |
            Set-Content windows-app/release/calorie-steward-product.cdx.json -Encoding utf8
          npm --prefix windows-app sbom --sbom-format cyclonedx --sbom-type application |
            Set-Content windows-app/release/calorie-steward-electron.cdx.json -Encoding utf8

      - name: Generate SHA-256 evidence
        shell: pwsh
        run: |
          $releaseFiles = @(
            Get-ChildItem windows-app/release -File -Filter '*.exe'
            Get-ChildItem windows-app/release -File -Filter '*.zip'
            Get-ChildItem windows-app/release -File -Filter '*.cdx.json'
          )
          if ($releaseFiles.Count -ne 4) { throw "Expected exactly one installer, one ZIP, and two SBOMs" }
          $releaseFiles | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)" } |
            Set-Content windows-app/release/SHA256SUMS.txt

      - name: Pass A - packaged UI, install, author, hash, and uninstall
        shell: pwsh
        run: ./windows-app/scripts/windows-lifecycle.ps1 -CandidateDirectory ./windows-app/release -Round 1 -EvidenceDirectory ./windows-app/evidence/native-round-1

      - name: Pass B - repeat on the exact same private bytes
        shell: pwsh
        run: ./windows-app/scripts/windows-lifecycle.ps1 -CandidateDirectory ./windows-app/release -Round 2 -EvidenceDirectory ./windows-app/evidence/native-round-2

      - name: Record remaining interactive Windows gates
        shell: pwsh
        run: |
          @'
          Automated Pass A and Pass B both confirm the same private candidate hashes,
          packaged React DOM, exact LAI ZEYU（来泽宇） authorship, portable launch,
          NSIS install, installed launch, UI marker/executable hash, and uninstall.
          Release remains blocked until an interactive clean Windows 11 standard-user run passes:
          file picker, JPEG re-encode, SQLite persistence, DPAPI credential replace/delete,
          JSON save dialog, scaling/accessibility, install/upgrade/uninstall, Defender, and WACK.
          Unsigned EXE/ZIP bytes stay inside this job and are never uploaded from the public repository.
          A public GitHub binary requires a trusted timestamped certificate whose signer CN/SimpleName
          is exactly LAI ZEYU or 来泽宇.
          '@ | Set-Content windows-app/evidence/WINDOWS_INTERACTIVE_GATES.txt

      - name: Write canonical two-pass result to the job summary
        if: always()
        shell: pwsh
        run: |
          $FirstPath = 'windows-app/evidence/native-round-1/lifecycle.json'
          $SecondPath = 'windows-app/evidence/native-round-2/lifecycle.json'
          if ((Test-Path -LiteralPath $FirstPath) -and (Test-Path -LiteralPath $SecondPath)) {
            $First = Get-Content -LiteralPath $FirstPath -Raw | ConvertFrom-Json
            $Second = Get-Content -LiteralPath $SecondPath -Raw | ConvertFrom-Json
            if ($First.round -ne 1 -or $Second.round -ne 2 -or
                $First.installerSha256 -cne $Second.installerSha256 -or
                $First.portableZipSha256 -cne $Second.portableZipSha256 -or
                $First.author -cne 'LAI ZEYU（来泽宇）' -or $Second.author -cne $First.author) {
              throw "Canonical lifecycle evidence does not bind two rounds to identical candidate bytes."
            }
            @(
              '## Calorie Steward private Windows QA',
              '',
              '- Author: `LAI ZEYU（来泽宇）`',
              '- Pass A: PASS',
              '- Pass B: PASS',
              "- Installer SHA-256: ``$($First.installerSha256)``",
              "- Portable ZIP SHA-256: ``$($First.portableZipSha256)``",
              '- Unsigned package bytes: kept inside the ephemeral job and not uploaded'
            ) >> $env:GITHUB_STEP_SUMMARY
          } else {
            @(
              '## Calorie Steward private Windows QA',
              '',
              '- Result: BLOCKED or FAILED before two complete lifecycle records',
              '- No unsigned package bytes were uploaded'
            ) >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Remove private candidate and evidence bytes
        if: always()
        shell: pwsh
        run: |
          foreach ($Path in @('windows-app/release', 'windows-app/evidence')) {
            if (Test-Path -LiteralPath $Path) { Remove-Item -LiteralPath $Path -Recurse -Force }
            if (Test-Path -LiteralPath $Path) { throw "Private QA cleanup failed: $Path" }
          }

  store-package-sideload-test:
    name: Store package - exact identity and temporary-signature sideload
    # External prerequisite: transfer repository ID 1345152257 into an
    # organization, then restrict this OS-specific runner group to this
    # workflow on protected main and provision a disposable --ephemeral VM.
    # The current user-owned repository has no runner-group capability or
    # matching runner, so the privileged job intentionally remains fail-closed.
    if: >-
      github.repository_id == '1345152257' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.ref_protected == true &&
      github.actor == 'lzy2767865503-pixel' &&
      github.triggering_actor == 'lzy2767865503-pixel' &&
      inputs.build_store_package
    runs-on:
      group: trusted-windows-interactive-calorie-store
      labels:
        - self-hosted
        - Windows
        - X64
        - interactive-wack
        - ephemeral
        - windows-11-24h2
    timeout-minutes: 330
    environment: windows-store-validation
    concurrency:
      group: calorie-store-self-hosted
      cancel-in-progress: false
    env:
      WINDOWS_IDENTITY_NAME: ${{ vars.CALORIE_WINDOWS_IDENTITY_NAME }}
      WINDOWS_PUBLISHER: ${{ vars.WINDOWS_PUBLISHER }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require Partner Center identity variables
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_IDENTITY_NAME)) {
            throw "Repository variable CALORIE_WINDOWS_IDENTITY_NAME is missing"
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_PUBLISHER)) {
            throw "Repository variable WINDOWS_PUBLISHER is missing"
          }

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            mobile-app/package-lock.json
            windows-app/package-lock.json

      - name: Install locked dependencies
        shell: pwsh
        run: |
          npm --prefix mobile-app ci
          npm --prefix windows-app ci

      - name: Reject malformed WACK and Authenticode policy evidence
        shell: pwsh
        run: ./windows-app/test/windows-release-policy.test.ps1

      - name: Build exact unsigned Store AppX
        run: npm --prefix windows-app run build:store

      - name: Generate Store candidate SBOMs
        shell: pwsh
        run: |
          npm --prefix mobile-app sbom --sbom-format cyclonedx --sbom-type application |
            Set-Content windows-app/release/calorie-steward-product.cdx.json -Encoding utf8
          npm --prefix windows-app sbom --sbom-format cyclonedx --sbom-type application |
            Set-Content windows-app/release/calorie-steward-electron.cdx.json -Encoding utf8

      - name: Prepare one frozen temporary-signature AppX for both Store passes
        shell: pwsh
        run: |
          $appxFiles = @(Get-ChildItem windows-app/release -File -Filter '*.appx')
          if ($appxFiles.Count -ne 1) { throw "Expected exactly one Store AppX" }
          $signingRoot = Join-Path $env:RUNNER_TEMP 'calorie-store-signing-${{ github.run_id }}-${{ github.run_attempt }}'
          ./windows-app/scripts/prepare-store-test-candidate.ps1 `
            -AppxPath $appxFiles[0].FullName `
            -Publisher $env:WINDOWS_PUBLISHER `
            -StateDirectory $signingRoot
          "CALORIE_STORE_SIGNING_ROOT=$signingRoot" >> $env:GITHUB_ENV
          "CALORIE_STORE_SIGNING_STATE=$(Join-Path $signingRoot 'state.json')" >> $env:GITHUB_ENV

      - name: Store Pass A - WACK, manifest, UI, install, and uninstall
        shell: pwsh
        run: |
          $appxFiles = @(Get-ChildItem windows-app/release -File -Filter '*.appx')
          if ($appxFiles.Count -ne 1) { throw "Expected exactly one Store AppX" }
          ./windows-app/scripts/windows-store-lifecycle.ps1 `
            -AppxPath $appxFiles[0].FullName `
            -IdentityName $env:WINDOWS_IDENTITY_NAME `
            -Publisher $env:WINDOWS_PUBLISHER `
            -SigningStatePath $env:CALORIE_STORE_SIGNING_STATE `
            -EvidenceDirectory ./windows-app/evidence/store-round-1 `
            -Round 1

      - name: Store Pass B - repeat WACK and lifecycle on identical AppX bytes
        shell: pwsh
        run: |
          $appxFiles = @(Get-ChildItem windows-app/release -File -Filter '*.appx')
          if ($appxFiles.Count -ne 1) { throw "Expected exactly one Store AppX" }
          ./windows-app/scripts/windows-store-lifecycle.ps1 `
            -AppxPath $appxFiles[0].FullName `
            -IdentityName $env:WINDOWS_IDENTITY_NAME `
            -Publisher $env:WINDOWS_PUBLISHER `
            -SigningStatePath $env:CALORIE_STORE_SIGNING_STATE `
            -EvidenceDirectory ./windows-app/evidence/store-round-2 `
            -Round 2

      - name: Write canonical Store validation result to the job summary
        if: always()
        shell: pwsh
        run: |
          $FirstPath = 'windows-app/evidence/store-round-1/store-lifecycle.json'
          $SecondPath = 'windows-app/evidence/store-round-2/store-lifecycle.json'
          if ((Test-Path -LiteralPath $FirstPath) -and (Test-Path -LiteralPath $SecondPath)) {
            $First = Get-Content -LiteralPath $FirstPath -Raw | ConvertFrom-Json
            $Second = Get-Content -LiteralPath $SecondPath -Raw | ConvertFrom-Json
            foreach ($Result in @($First, $Second)) {
              if ($Result.author -cne 'LAI ZEYU（来泽宇）' -or
                  $Result.publisherDisplayName -cne 'LAI ZEYU' -or
                  $Result.publisher -cne 'CN=A5F91D0A-30C6-48EE-944F-B767FA872BE8' -or
                  [string]$Result.signedAppxSha256 -notmatch '^[0-9a-f]{64}$' -or
                  [string]$Result.temporaryCertificateThumbprint -notmatch '^[0-9A-F]{40,64}$' -or
                  [string]$Result.signToolSha256 -notmatch '^[0-9a-f]{64}$' -or
                  [string]$Result.makeAppxSha256 -notmatch '^[0-9a-f]{64}$' -or
                  [string]$Result.appCertSha256 -notmatch '^[0-9a-f]{64}$' -or
                  [string]::IsNullOrWhiteSpace([string]$Result.signToolFileVersion) -or
                  [string]::IsNullOrWhiteSpace([string]$Result.makeAppxFileVersion) -or
                  [string]::IsNullOrWhiteSpace([string]$Result.appCertFileVersion) -or
                  $Result.wackOverall -notin @('PASS', 'PASSED') -or
                  $Result.wackLatestVersion -ne $true -or
                  [string]$Result.wackVersion -notmatch '^\d+(?:\.\d+){2,3}$') {
                throw "Store lifecycle result is not the exact reviewed identity and complete WACK PASS."
              }
            }
            if ($First.round -ne 1 -or $Second.round -ne 2 -or
                $First.sourceCommit -cne $Second.sourceCommit -or
                $First.appxSha256 -cne $Second.appxSha256 -or
                $First.signedAppxSha256 -cne $Second.signedAppxSha256 -or
                $First.temporaryCertificateThumbprint -cne $Second.temporaryCertificateThumbprint -or
                $First.signToolSha256 -cne $Second.signToolSha256 -or
                $First.signToolFileVersion -cne $Second.signToolFileVersion -or
                $First.makeAppxSha256 -cne $Second.makeAppxSha256 -or
                $First.makeAppxFileVersion -cne $Second.makeAppxFileVersion -or
                $First.appCertSha256 -cne $Second.appCertSha256 -or
                $First.appCertFileVersion -cne $Second.appCertFileVersion -or
                $First.executableSha256 -cne $Second.executableSha256 -or
                $First.identityName -cne $Second.identityName) {
              throw "Store Pass A and Pass B do not bind the same source and AppX bytes."
            }
            @(
              '## Calorie Steward Store validation',
              '',
              '- Author/publisher display: `LAI ZEYU（来泽宇）` / `LAI ZEYU`',
              '- Store Pass A: WACK + process-bound lifecycle PASS',
              '- Store Pass B: WACK + process-bound lifecycle PASS',
              "- WACK versions: ``$($First.wackVersion)`` / ``$($Second.wackVersion)`` (latest: true)",
              "- Source AppX SHA-256: ``$($First.appxSha256)``",
              "- Identical temporary-signed AppX SHA-256: ``$($First.signedAppxSha256)``",
              "- WACK report SHA-256 A: ``$($First.wackReportSha256)``",
              "- WACK report SHA-256 B: ``$($Second.wackReportSha256)``",
              '- AppX and temporary certificate bytes: not uploaded'
            ) >> $env:GITHUB_STEP_SUMMARY
          } else {
            @(
              '## Calorie Steward Store validation',
              '',
              '- Result: BLOCKED or FAILED before complete WACK/lifecycle evidence',
              '- No AppX or temporary certificate bytes were uploaded'
            ) >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Remove one-time Store QA certificate, private key, and signed AppX
        if: always()
        shell: pwsh
        run: |
          $signingRoot = Join-Path $env:RUNNER_TEMP 'calorie-store-signing-${{ github.run_id }}-${{ github.run_attempt }}'
          ./windows-app/scripts/cleanup-store-test-candidate.ps1 -StateDirectory $signingRoot

      - name: Remove private Store package and evidence bytes
        if: always()
        shell: pwsh
        run: |
          foreach ($Path in @('windows-app/release', 'windows-app/evidence')) {
            if (Test-Path -LiteralPath $Path) { Remove-Item -LiteralPath $Path -Recurse -Force }
            if (Test-Path -LiteralPath $Path) { throw "Private Store cleanup failed: $Path" }
          }
